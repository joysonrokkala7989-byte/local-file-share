<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local File Share</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📁 Local File Share</h1>

        <p class="subtitle">
            Send files between computers on the same Wi-Fi
        </p>


        <!-- Upload Box -->

        <div class="card">

            <div id="dropArea" class="drop-area">

                <div class="upload-icon">
                    📤
                </div>

                <h2>
                    Drop your file here
                </h2>

                <p>
                    or
                </p>

                <label class="choose-button">

                    Choose File

                    <input
                        type="file"
                        id="fileInput"
                        hidden
                    >

                </label>

            </div>


            <!-- Selected file -->

            <div
                id="selectedFile"
                class="selected-file">
            </div>


            <!-- Send button -->

            <button
                id="uploadButton"
                class="upload-button">

                Send File

            </button>


            <!-- Progress -->

            <div class="progress-container">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>


            <!-- Status -->

            <p
                id="status"
                class="status">
            </p>

        </div>


        <!-- Received files -->

        <div class="card">

            <h2>
                📥 Received Files
            </h2>

            <div id="fileList">

                Loading...

            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
